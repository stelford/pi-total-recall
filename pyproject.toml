[project]
name = "pi-total-recall"
version = "0.1.0"
description = "SQLite-backed fact memory for Pi, exposed over MCP with FastMCP"
requires-python = ">=3.10"
dependencies = ["fastmcp>=2.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
